when:
  - event: manual

labels:
  homeserver: homeserver
  debian-13: debian-13

# partial/shallow clone ломает push на GitHub (missing objects).
clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  publish-github:
    image: debian:13
    environment:
      GH_ACCESS_TOKEN:
        from_secret: GH_ACCESS_TOKEN
      GH_USER:
        from_secret: GH_USER
      DEBIAN_FRONTEND: noninteractive
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git curl jq ca-certificates
      - chmod +x .woodpecker/publish-github.sh
      - .woodpecker/publish-github.sh
